name: release

on:
  push:
    tags: ['onicost-agent-*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Check that the tag matches the chart version
        id: version
        run: |
          version="${GITHUB_REF_NAME#onicost-agent-}"
          chart_version="$(helm show chart charts/onicost-agent | sed -n 's/^version: *//p' | tr -d '"')"
          app_version="$(helm show chart charts/onicost-agent | sed -n 's/^appVersion: *//p' | tr -d '"')"
          if [ "$version" != "$chart_version" ] || [ "$version" != "$app_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $chart_version and appVersion $app_version of Chart.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The same checks as ci.yml: a tag on a commit that never passed them must not publish a chart.
      - run: helm lint charts/onicost-agent --strict
      - run: helm template onicost-agent charts/onicost-agent --set endpoint=https://ingest.example.test > /dev/null
      - run: helm package charts/onicost-agent
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
      - name: Push the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm push "onicost-agent-${VERSION}.tgz" oci://ghcr.io/samytsb/charts
