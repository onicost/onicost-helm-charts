# Values of the Onicost agent chart. values.schema.json rejects unknown keys at the top level and in the
# typed sections, so a misspelled key fails the install or the upgrade. resources, affinity and the items of
# tolerations, networkPolicy.extraEgress and networkPolicy.metricsFrom follow the Kubernetes objects and are
# not checked key by key; global is accepted and not read.

# Required: base URL of the ingestion gateway, without a trailing "/". The
# agent adds /v1/ingest/usage and /v1/ingest/inventory to it.
endpoint: ""

# The agent token is read from an existing Secret of the release namespace,
# created by the install command. The chart never creates this Secret and
# accepts no token value.
token:
  existingSecret: onicost-agent-token
  # Key of the token in the Secret, mounted as the file "token".
  secretKey: token

kubelet:
  # false: the certificate of each kubelet is checked with the cluster
  # authority. true: no check, for kubelets with self-signed certificates.
  insecureSkipVerify: false
  # true: the ClusterRole grants get on nodes/proxy, so that a kubelet whose
  # certificate fails the checks (as on Scaleway Kapsule) is scraped through
  # the API server proxy. This permission opens the whole kubelet API of every
  # node, not only its metrics.
  apiServerProxy: false

actions:
  # false: the agent is read-only; it reads the schedule of its cluster but
  # changes nothing and reports actions_disabled. true: the ClusterRole lets it
  # scale Deployments and StatefulSets, suspend CronJobs, set the minReplicas
  # of their HorizontalPodAutoscalers and annotate these objects, for the
  # scheduler rules activated in Onicost. Never creates nor deletes anything.
  enabled: false

# Interval between two scrapes of a kubelet: 10s, 15s, 20s, 30s or 60s.
scrapeInterval: 30s

exclude:
  # Exact names of the namespaces of which nothing is sent.
  namespaces: []
  # Exact label keys removed from every label set before sending.
  labelKeys: []

proxy:
  # Outgoing HTTP proxy (http:// or https://), used only to reach the
  # gateway. Empty: direct connection.
  url: ""

image:
  repository: ghcr.io/onicost/onicost-agent
  # Empty: the appVersion of the chart.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Standard keys of the pod, empty by default.
imagePullSecrets: []
podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# NetworkPolicy of the agent pod, for a namespace that denies traffic by
# default. false: no NetworkPolicy is created.
networkPolicy:
  enabled: false
  # Egress to the cluster DNS, UDP and TCP 53: labels of the namespace and
  # labels of the DNS pods. Helm merges these maps with the defaults: set a
  # label to null to drop it, or a selector to null to clear it. An empty
  # selector matches every namespace or every pod; both empty: port 53 to any
  # destination.
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # TCP ports the agent must reach: the API server (6443, or 443 on some
  # clouds), the kubelets (10250) and the gateway (443). Empty: no such rule.
  egressPorts: [443, 6443, 10250]
  # Optional CIDR allow-list for the ports above. Empty: any destination.
  egressCidrs: []
  # Extra egress rules (NetworkPolicyEgressRule objects), appended as-is.
  extraEgress: []
  # Peers (NetworkPolicyPeer objects) allowed to reach the metrics port, http.
  # Empty: no ingress rule; the probes come from the kubelet and need none.
  metricsFrom: []
