{{- /*
Read-only access by default: no Secret, no ConfigMap, no write.
HorizontalPodAutoscalers and PodDisruptionBudgets are read for the
recommendations (get, list and watch only). GET /version is already allowed by
system:public-info-viewer. get on nodes/proxy, which opens the whole kubelet
API of every node, only with kubelet.apiServerProxy. The write rules of the
scheduler only with actions.enabled: patch on the workloads and on the
HorizontalPodAutoscalers; never update, the scale subresource, create, delete,
Secrets, ConfigMaps or CRDs.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "onicost-agent.fullname" . }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  {{- if .Values.kubelet.apiServerProxy }}
  # Kubelets whose certificate fails the checks, scraped through the API server.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  {{- end }}
  {{- if .Values.actions.enabled }}
  # Actions mode of the scheduler: patch replicas, suspend, minReplicas and annotations.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, patch]
  {{- end }}
