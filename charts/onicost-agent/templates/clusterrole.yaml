{{- /*
Read-only access by default: no Secret, no ConfigMap, no write. GET /version is
already allowed by system:public-info-viewer. get on nodes/proxy, which opens
the whole kubelet API of every node, only with kubelet.apiServerProxy. The
write rules of the scheduler only with actions.enabled: patch and update on
the workloads and their scale, and on the HorizontalPodAutoscalers, which the
agent then watches; never create, delete, Secrets, ConfigMaps or CRDs.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "onicost-agent.fullname" . }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  {{- if .Values.kubelet.apiServerProxy }}
  # Kubelets whose certificate fails the checks, scraped through the API server.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  {{- end }}
  {{- if .Values.actions.enabled }}
  # Actions mode of the scheduler: scale, suspend and annotate workloads.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [patch, update]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, patch, update]
  {{- end }}
