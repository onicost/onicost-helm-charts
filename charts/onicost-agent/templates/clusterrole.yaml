{{- /*
Read-only access: no Secret, no ConfigMap, no write. GET /version is already
allowed by system:public-info-viewer.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "onicost-agent.fullname" . }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
