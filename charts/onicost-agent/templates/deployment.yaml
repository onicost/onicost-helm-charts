apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onicost-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
spec:
  # One replica without leader election: the old pod stops before the new one
  # starts, and a restart loses at most the buffer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "onicost-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "onicost-agent.podLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "onicost-agent.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # Restricted level of the Pod Security Standards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.autoresize.enabled }}
            # Admission webhook of the auto-resize, HTTPS.
            - name: webhook
              containerPort: 9443
              protocol: TCP
            {{- end }}
          # Every variable is always defined, possibly to the empty string.
          env:
            - name: ONICOST_ENDPOINT
              value: {{ required "endpoint is required: set it to the base URL of the Onicost ingestion gateway" .Values.endpoint | quote }}
            - name: ONICOST_TOKEN_FILE
              value: "/var/run/secrets/onicost/token"
            - name: ONICOST_HEALTH_ADDR
              value: ":8080"
            - name: ONICOST_KUBELET_INSECURE_SKIP_VERIFY
              value: {{ .Values.kubelet.insecureSkipVerify | quote }}
            - name: ONICOST_SCRAPE_INTERVAL
              value: {{ .Values.scrapeInterval | quote }}
            - name: ONICOST_EXCLUDE_NAMESPACES
              value: {{ join "," .Values.exclude.namespaces | quote }}
            - name: ONICOST_EXCLUDE_LABEL_KEYS
              value: {{ join "," .Values.exclude.labelKeys | quote }}
            - name: ONICOST_PROXY_URL
              value: {{ .Values.proxy.url | quote }}
            - name: ONICOST_ACTIONS_ENABLED
              value: {{ .Values.actions.enabled | quote }}
            # Namespace of the agent, which the scheduler never touches.
            - name: ONICOST_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.autoresize.enabled }}
            # Auto-resize mode, only when enabled: without it, the Deployment is that of the chart without the mode.
            - name: ONICOST_AUTORESIZE_ENABLED
              value: "true"
            - name: ONICOST_AUTORESIZE_WEBHOOK_ADDR
              value: ":9443"
            - name: ONICOST_AUTORESIZE_TLS_DIR
              value: "/etc/onicost/autoresize-tls"
            {{- end }}
          # The Secret is mounted without subPath, so that a new token reaches
          # the file without a restart.
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/onicost
              readOnly: true
            {{- if .Values.autoresize.enabled }}
            # Certificate of the webhook, read again by the agent when the kubelet updates it.
            - name: autoresize-tls
              mountPath: /etc/onicost/autoresize-tls
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: token
          secret:
            secretName: {{ .Values.token.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.token.secretKey | quote }}
                path: token
        {{- if .Values.autoresize.enabled }}
        - name: autoresize-tls
          secret:
            secretName: {{ printf "%s-tls" (include "onicost-agent.autoresizeName" .) | quote }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
