{{- /*
Auto-resize mode: the admission webhook served by the agent on port 9443, which gives the new pods of every namespace
the values validated in Onicost, but in the namespaces the agent never touches: those of schedule.AlwaysExcluded in
the agent (kube-system, kube-public, kube-node-lease, argocd, flux-system), the release namespace and
exclude.namespaces. The API server does not even call it there. It never blocks a pod: failurePolicy Ignore and a 2 s
timeout, so that pods are created with the values of their template when the agent is down. The certificate
is generated by Helm for <service>.<namespace>.svc and kept in the Secret across upgrades (lookup); delete the Secret
and upgrade to get a new one. The agent reads it again every minute. The Secret and the caBundle come from the same
render, in this file.
*/ -}}
{{- if .Values.autoresize.enabled }}
{{- $name := include "onicost-agent.autoresizeName" . }}
{{- $secretName := printf "%s-tls" $name }}
{{- $host := printf "%s.%s.svc" $name .Release.Namespace }}
{{- $excluded := concat (list .Release.Namespace "kube-system" "kube-public" "kube-node-lease" "argocd" "flux-system") .Values.exclude.namespaces | uniq }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data | default dict }}
{{- end }}
{{- if and (index $data "tls.crt") (index $data "tls.key") (index $data "ca.crt") }}
{{- $crt = index $data "tls.crt" }}
{{- $key = index $data "tls.key" }}
{{- $ca = index $data "ca.crt" }}
{{- else }}
{{- $authority := genCA (printf "%s-ca" $name) 3650 }}
{{- $cert := genSignedCert $host nil (list $name (printf "%s.%s" $name .Release.Namespace) $host) 3650 $authority }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $authority.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "onicost-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $name }}
  labels:
    {{- include "onicost-agent.labels" . | nindent 4 }}
webhooks:
  - name: pods.autoresize.onicost.com
    admissionReviewVersions: [v1]
    sideEffects: None
    # A webhook that fails or does not answer leaves the pod with the values of its template.
    failurePolicy: Ignore
    timeoutSeconds: 2
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: {{ $name }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-pods
        port: 443
      caBundle: {{ $ca }}
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
    # Every namespace but the agent's own, the ones the agent never touches and exclude.namespaces, which the API
    # server does not call the webhook for.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range $excluded }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
